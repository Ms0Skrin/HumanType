<svg width="760" height="190" viewBox="0 0 760 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Typing in the wrong layout, then the fix: SMIL, plays in GitHub's image view. Loop: 8 s. -->
  <style>
    .t { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace; font-size: 30px; }
    .ui { font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif; }
  </style>
  <rect width="760" height="190" rx="18" fill="#0F172A"/>
  <rect x="0.5" y="0.5" width="759" height="189" rx="17.5" stroke="#334155"/>
  <circle cx="28" cy="26" r="6" fill="#F87171"/><circle cx="48" cy="26" r="6" fill="#FBBF24"/><circle cx="68" cy="26" r="6" fill="#34D399"/>
  <text x="380" y="31" class="ui" font-size="14" fill="#64748B" text-anchor="middle">Сообщение</text>
  <!-- layout badge -->
  <rect x="690" y="12" width="52" height="26" rx="7" fill="#1E293B" stroke="#334155"/>
  <text x="716" y="31" class="ui" font-size="15" font-weight="700" fill="#E2E8F0" text-anchor="middle">EN
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.41;0.42;0.99;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="716" y="31" class="ui" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="middle" opacity="0">RU
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.42;0.99;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <!-- the line being typed: each step shown for its window of time -->
  <text x="40" y="112" class="t" fill="#94A3B8"><tspan fill-opacity="0">g<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.05;0.0501;1" dur="8s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">h<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.08;0.0801;1" dur="8s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">b<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.11;0.1101;1" dur="8s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">d<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.14;0.1401;1" dur="8s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">t<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.17;0.1701;1" dur="8s" repeatCount="indefinite"/></tspan><tspan fill-opacity="0">n<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.2;0.2001;1" dur="8s" repeatCount="indefinite"/></tspan>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.4;0.41;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="40" y="112" class="t" fill="#F8FAFC" font-weight="700" opacity="0" xml:space="preserve">привет <tspan font-weight="400" fill="#E2E8F0" fill-opacity="0">как<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.62;0.6201;1" dur="8s" repeatCount="indefinite"/></tspan><tspan font-weight="400" fill="#E2E8F0" fill-opacity="0"> дела<animate attributeName="fill-opacity" values="0;0;1;1" keyTimes="0;0.72;0.7201;1" dur="8s" repeatCount="indefinite"/></tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.42;0.97;1" dur="8s" repeatCount="indefinite"/></text>
  <!-- the note that pops up near the caret -->
  <g opacity="0">
    <rect x="40" y="134" width="230" height="36" rx="9" fill="#1E2026" fill-opacity="0.94" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="155" y="158" class="ui" font-size="16" fill="#F2F4F8" text-anchor="middle">ghbdtn  →  привет</text>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.45;0.75;0.8;1" dur="8s" repeatCount="indefinite"/>
  </g>
  <!-- hint on the right -->
  <text x="720" y="160" class="ui" font-size="15" fill="#64748B" text-anchor="end" opacity="0">пробел
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.42;0.43;1" dur="8s" repeatCount="indefinite"/>
  </text>
</svg>
