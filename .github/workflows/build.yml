# Tests on every push; the Windows installer on every push to main (as an artifact) and,
# for a tag v*, published as a release with the installer attached.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install evdev pyside6
      - name: Linux engine
        run: python tests/linux_engine.py
      - name: Windows logic (Win32 faked)
        run: python tests/sim_autoswitch.py

  desktops:
    # The KDE, Hyprland, Sway backends against fake compositors; system Python for PyGObject.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-evdev dbus gir1.2-atspi-2.0
      - run: dbus-run-session -- /usr/bin/python3 tests/linux_desktops.py

  windows:
    needs: [tests, desktops]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies
        run: pip install pyside6 pywin32 comtypes pyinstaller
      - name: Version
        id: ver
        shell: bash
        run: |
          v="$(python -c 'from humantype import __version__; print(__version__)')"
          # One version for Windows and Linux: a release tag must name the version in the code.
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match humantype.__version__ = $v"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean HumanType.spec
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: HumanType-Setup-${{ steps.ver.outputs.version }}
          path: installer/*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: installer/*.exe
          generate_release_notes: true
